<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlow3" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Styles & Animations -->
    <style>
      @keyframes floatDriftLeft {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-35px); }
        100% { transform: translateX(0px); }
      }
      @keyframes floatDriftRight {
        0% { transform: translateX(0px); }
        50% { transform: translateX(35px); }
        100% { transform: translateX(0px); }
      }
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.7; }
        50% { transform: scale(1.15) translate(15px, -10px); opacity: 0.95; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -120; }
      }
      @keyframes badgePulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.6)); }
      }

      .pulse-bg { animation: pulseOrb 10s ease-in-out infinite; transform-origin: center; }
      .drift-left { animation: floatDriftLeft 14s ease-in-out infinite; }
      .drift-right { animation: floatDriftRight 12s ease-in-out infinite; }
      .grid-wave { stroke-dasharray: 8 6; animation: dashFlow 20s linear infinite; }
      .badge-glow { animation: badgePulse 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="420" fill="#090d16" />

  <!-- Animated Latent Glow Background Orbs -->
  <g class="pulse-bg">
    <circle cx="240" cy="140" r="280" fill="url(#bgGlow1)" />
    <circle cx="960" cy="280" r="280" fill="url(#bgGlow2)" />
    <circle cx="600" cy="210" r="220" fill="url(#bgGlow3)" />
  </g>

  <!-- Latent Grid & Tensor Flow Vectors -->
  <g opacity="0.25">
    <line x1="0" y1="70" x2="1200" y2="70" stroke="#38bdf8" stroke-width="1" class="grid-wave" />
    <line x1="0" y1="140" x2="1200" y2="140" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#f472b6" stroke-width="1" class="grid-wave" />
    
    <line x1="150" y1="0" x2="150" y2="420" stroke="#6366f1" stroke-width="1" stroke-dasharray="6 6" />
    <line x1="1050" y1="0" x2="1050" y2="420" stroke="#c084fc" stroke-width="1" stroke-dasharray="6 6" />
  </g>

  <!-- Ambient Dynamic Floating Tech Tags (Top Margin Track) -->
  <g class="drift-left" opacity="0.9">
    <g transform="translate(60, 24)">
      <rect width="130" height="30" rx="15" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1" />
      <text x="65" y="20" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ FLUX.1 [DiT]</text>
    </g>
    <g transform="translate(340, 24)">
      <rect width="140" height="30" rx="15" fill="url(#pillGrad2)" stroke="#ec4899" stroke-width="1" />
      <text x="70" y="20" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎨 Midjourney v6</text>
    </g>
    <g transform="translate(680, 24)">
      <rect width="145" height="30" rx="15" fill="url(#pillGrad1)" stroke="#818cf8" stroke-width="1" />
      <text x="72.5" y="20" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🧠 SD 3.5 Large</text>
    </g>
    <g transform="translate(980, 24)">
      <rect width="135" height="30" rx="15" fill="url(#pillGrad2)" stroke="#a855f7" stroke-width="1" />
      <text x="67.5" y="20" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✨ DALL-E 3</text>
    </g>
  </g>

  <!-- Ambient Dynamic Floating Tech Tags (Bottom Margin Track) -->
  <g class="drift-right" opacity="0.9">
    <g transform="translate(90, 366)">
      <rect width="170" height="30" rx="15" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1" />
      <text x="85" y="20" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🧩 ComfyUI Node Graph</text>
    </g>
    <g transform="translate(390, 366)">
      <rect width="165" height="30" rx="15" fill="url(#pillGrad2)" stroke="#ec4899" stroke-width="1" />
      <text x="82.5" y="20" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎯 ControlNet Spatial</text>
    </g>
    <g transform="translate(690, 366)">
      <rect width="150" height="30" rx="15" fill="url(#pillGrad1)" stroke="#818cf8" stroke-width="1" />
      <text x="75" y="20" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🚀 InvokeAI Canvas</text>
    </g>
    <g transform="translate(960, 366)">
      <rect width="155" height="30" rx="15" fill="url(#pillGrad2)" stroke="#a855f7" stroke-width="1" />
      <text x="77.5" y="20" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📐 Recraft V4 Vector</text>
    </g>
  </g>

  <!-- FOREGROUND HERO CONTAINER: Elevated Acrylic Card (Guarantees Text is 100% Unobstructed) -->
  <g filter="url(#shadow)" transform="translate(150, 75)">
    <!-- Frosted Card Background -->
    <rect width="900" height="268" rx="20" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Top Badge -->
    <g transform="translate(350, 28)" class="badge-glow">
      <rect width="200" height="26" rx="13" fill="#1e1b4b" stroke="#a855f7" stroke-width="1" />
      <text x="100" y="17" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">🔮 GENERATIVE AI &amp; DIFFUSION</text>
    </g>

    <!-- Main Title (Gradient Foreground) -->
    <text x="450" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
      Awesome Diffusion Models
    </text>
    <text x="450" y="146" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      &amp; Generative AI Ecosystem
    </text>

    <!-- Glowing Accent Divider -->
    <line x1="250" y1="172" x2="650" y2="172" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Subtitle -->
    <text x="450" y="206" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Curated Directory of Foundation Models, Production SaaS &amp; Open-Source Pipelines
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(170, 226)">
      <text x="0" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">✦ Latent Diffusion</text>
      <text x="160" y="16" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">✦ DiT Transformers</text>
      <text x="350" y="16" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">✦ ControlNet &amp; LoRA</text>
      <text x="530" y="16" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">✦ SOTA Production</text>
    </g>
  </g>
</svg>
